# Desktop defaults. Copy to $XDG_CONFIG_HOME/desktop/config.ini (normally ~/.config).
# Run desktop reload after editing. Lines beginning with # or ; are comments.
# Paths support ~ and the XDG variables shown below. Hook values are shell commands.

[library]
directory = ${XDG_CONFIG_HOME}/wallpapers
recursive = false
images = true
videos = true

[rotation]
# manual, login (shuffle once each X session), interval, or daily (local date).
mode = login
minutes = 30
no_repeat = true

[layout]
# Cover each output with an independent crop. Percentages specify the crop anchor.
focal_x = 50
focal_y = 50
background = #0D0E0F
crossfade_ms = 180

[parallax]
enabled = true
# Rest the effect on each output that shows a visible application window.
empty_only = true
# Maximum offset from center on each axis, in screen pixels.
travel_px = 6
ease_ms = 300
# Cap wallpaper movement in pixels per second. Set to 0 for no speed limit.
max_speed_px_s = 24
fps = 30

[video]
# Videos loop silently. The last frame stays visible when playback slows to a stop.
# Pause playback on each output that shows a visible application window.
empty_only = true
# Time to ease between stopped and full speed. Set to 0 for an immediate change.
ramp_ms = 1000
# 1 is linear. Higher powers (up to 6) make starts slower and braking stronger near the end.
ramp_power = 3
fps = 24
# Limit the longest decoded edge per display. Eligibility uses the source resolution.
max_dimension = 3840
# These release helpers fall back to ffmpeg and ffprobe from PATH.
ffmpeg = desktop-ffmpeg
ffprobe = desktop-ffprobe

[blur]
# Soften stills and videos on each display with an open window. Clear on empty displays.
enabled = true
# Gaussian blur strength in screen pixels (0 to 96). Set to 0 for a sharp wallpaper.
radius_px = 24
# Time to blur or clear. Set to 0 for an immediate change.
transition_ms = 650
# 1 is linear. 2 to 6 progressively soften both ends of the transition.
easing_power = 3

[motion]
# Time for parallax to settle when the desktop becomes occupied.
slowdown_ms = 320
pause_on_blank = true

[hooks]
# Shell commands receive DESKTOP_WALLPAPER and DESKTOP_MEDIA (image or video).
# after_login runs synchronously before desktop login returns.
# after_set runs on later wallpaper changes, including an explicit shuffle.
after_login =
after_set =

[ui]
# Empty colors inherit desktop.* Xresources, then mwm.* and the built-in palette.
# Empty font paths use desktop.font / desktop.mono, then bundled Geist faces.
font =
mono =
font_size = 14
width = 900
height = 650
# -1 inherits desktop.cornerRadius / mwm.segradius, or uses 6 px.
corner_radius = -1
animation_ms = 130
background =
panel =
foreground =
muted =
border =
accent =
on_accent =
